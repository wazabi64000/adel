<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1c1a18">
<title>Hors ligne — Coach Adel</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icons/favicon-32.png" type="image/png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    font-family: ui-sans-serif, system-ui, sans-serif;
    background: #1c1a18; color: #f5f1ea; padding: 24px;
  }
  .card {
    width: min(100%, 420px); background: #252220; border: 1px solid rgba(255,255,255,.1);
    border-radius: 2px; padding: 28px 24px; text-align: center;
  }
  .brand { font-weight: 900; letter-spacing: -.03em; font-size: 1.25rem; margin: 0 0 18px; }
  .brand span { color: #ef8a2c; }
  h1 { font-size: 1.35rem; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #a39d94; line-height: 1.45; }
  a {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 0 20px; border-radius: 2px;
    background: #ef8a2c; color: #1c1a18; font-weight: 800; text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="brand"><img src="/image/logo.png" alt="" width="36" height="36" style="width:36px;height:36px;border-radius:8px;vertical-align:middle;margin-right:8px">COACH<span>ADEL</span></p>
    <h1>Tu es hors ligne</h1>
    <p>Cette page n’est pas disponible sans connexion. Réessaie dès que le réseau revient.</p>
    <a href="/">Réessayer</a>
  </div>
  <script>
    window.addEventListener('online', () => { location.href = '/'; });
  </script>
</body>
</html>
