# Fail2Ban filter — Application Coach Adel
# Journal attendu (stdout / fichier) :
#   [adel-security] AUTH_FAIL ip=1.2.3.4 method=POST path=/login
#   [adel-security] RATE_LIMIT ip=1.2.3.4 method=POST path=/login kind=auth

[Definition]
failregex = ^\s*\[adel-security\]\s+(AUTH_FAIL|RATE_LIMIT|FORBIDDEN)\s+ip=<HOST>\b
ignoreregex =
